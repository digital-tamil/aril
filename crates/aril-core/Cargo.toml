[package]
name = "aril-core"
description = "Ultra-fast, deterministic Tamil font converter: compiles 29+ legacy encodings (Bamini, TSCII, Vanavil, ShreeLipi) into single-pass Aho–Corasick automatons for O(N) bidirectional Unicode conversion."
keywords = ["tamil", "unicode", "bamini", "tscii", "font-converter"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aril-core"
readme.workspace = true
license.workspace = true


[dependencies]
aho-corasick = { workspace = true }
thiserror = { workspace = true }      
rayon = { workspace = true, optional = true }

[features]
default = []
parallel = ["dep:rayon"]
