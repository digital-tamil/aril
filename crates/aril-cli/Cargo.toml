[package]
name = "aril-cli"
description = "High-throughput CLI tool for batch converting and archiving legacy Tamil fonts (Bamini, TSCII, ShreeLipi) and legacy-encoded PDF documents to standard Unicode."
keywords = ["tamil", "cli", "unicode", "pdf-converter", "font-converter"]
categories = ["command-line-utilities", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "aril"
path = "src/main.rs"

[dependencies]
aril-core = { workspace = true, features = ["parallel"] }
clap = { workspace = true }
clap_complete = "4.6.11"
anyhow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lopdf = { workspace = true, optional = true }

[features]
default = ["pdf"]
pdf = ["dep:lopdf"]
